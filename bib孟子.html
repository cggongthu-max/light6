<p align="center" style="line-height: 200%; margin-bottom: 0cm; page-break-before: always">
<font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">7.10</span></font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">孟子曰：“自暴者，不可与有言也；自弃者，不可与有为也。言非礼义，谓之自暴也；吾身不能居仁由义，谓之自弃也。仁，人之安宅也；义，人之正路也。旷安宅而弗居，舍正路而不由，哀哉！”</font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">朱一旦短剧中旦总相中一小奶狗成星，在旦总供养下从清澈的眼神乃至目空一切。“人之将死，其言也善”，旦总撤资后旗下艺人的卑微道歉让他扭曲的心理得到满足。</font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">旦总和旗下艺人正是这样一对自暴和自弃者。“君之视臣如犬马，则臣视君如国人。”面对仁义的缺位，儒子当致力于“致君尧舜上，再使风俗淳”之政治理想。</font></font></p>
