<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">言非礼义</font></font><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">,</span></font></font><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">谓之自暴也</font></font><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">;</span></font></font><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">吾身不能居仁由义</font></font><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">,</span></font></font><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">谓之自弃也</font></font><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">.</span></font></font></p>
