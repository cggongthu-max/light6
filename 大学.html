<p align="center" style="line-height: 200%; margin-bottom: 0cm; page-break-before: always">
<font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">1</span></font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">大学之道在明明，德在亲民，在止于至善。</font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">大学之道，以其昭昭，使人昭昭，故言，大学之道在明明。</font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">知德者鲜，德在亲民，圣也夫子，温良礼让，浩浩昭昭，止如恒星。</font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><br/>

</p>
<p align="center" style="line-height: 200%; margin-bottom: 0cm; page-break-before: always">
<font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">2</span></font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">知止而后能定，定而后能静，静而后能安，安而后能虑，虑而后能得。</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">学而不厌。教而不倦。</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">诚明有信。爱亲及人。</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><br/>

</p>
