<p align="center" style="line-height: 200%; margin-bottom: 0cm"><font face="IPAGothic, sans-serif"><font size="6" style="font-size: 28pt">树与樱</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><br/>

</p>
<p align="center" style="line-height: 200%; margin-bottom: 0cm; page-break-before: always">
<font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">序曲</font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">傍晚，都市的主环路上人、畜、资具等类繁忙奔波着，人行道的昏暗路灯下，三三两两的行人中是行走的樱。一旁的小吃店，玻璃墙上清一色的红色招牌，考究的装潢中只见匆匆的客人，无心顾及玻璃墙外投来的并非复杂交织的目光。小姐加快步伐，隐去在波流中…</font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><br/>

</p>
<p align="center" style="line-height: 200%; margin-bottom: 0cm; page-break-before: always">
<font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">1</span></font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">小姐第一次读鲁迅是在初中。不是在教材里，而是从母亲的书架中拿的。</font></font></p>
<p style="text-align: start; line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">《狂人日记》的结尾在“救救孩子……”处戛然而止。救救谁？</font></font></p>
<p align="center" style="line-height: 200%; margin-bottom: 0cm; page-break-before: always">
<font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">2</span></font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">粱繁是小姐的初中同学。</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">孔子以无轴之车喻言而无信者。</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">小姐喜欢把这句《论语》理解成夫子对无礼无义者的原谅，而不仅仅是对不诚信者的谴责。</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt">粱繁不爱学习，不是不聪明，毕竟是名校重点班。</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><br/>

</p>
