<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">甲午后中国学日本为什么没有实践</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">甲午后，中国人学日本，派了大量的留学生，但日本的精髓并不深奥，很容易就看出来，就是甘当炮灰、砸锅卖铁的搞侵略。中国怎么不学，留日回来的学生也不搞这一套，是觉得太残酷了，还是因为制度有问题？</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="Noto Serif, serif"><font size="4" style="font-size: 14pt">（不虚伪</font></font><font face="Noto Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">@</span></font></font><font face="Noto Serif, serif"><font size="4" style="font-size: 14pt">儒家吧

<p style="line-height: 200%; margin-bottom: 0cm"><font face="Noto Serif, serif"><font size="4" style="font-size: 14pt">日本明治维新后西方思潮涌入，孙中山留日学成归来提出共和的主张。你咋总是以为放个套子里就完了涅，我看你闺蜜就是想找人拜把子。</font></font></p>
