<font face="Liberation Serif, serif"><font size="4" style="font-size: 14pt"><span lang="en-US">1</span></font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">墨家有两个问题，一直没搞明白：</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">一，他们鼎盛时控制了多大的领地，有宋江的梁山泊大吗？领地是整地的还是零散的？零散分布于各诸侯吗？</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">二，他们有没有搞“国中之国”，就是在各诸侯的领地上建立了一套独立于诸侯的体系，他们如果真搞“国中之国”，诸侯们没削他们吗？</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">国服宫本方法</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">假如说网上的救世大业，圣人圣女都是虚伪的，只有自私自利的抱团才是适合发展的对不对</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt"><span lang="en-US">abcdenm</span></font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">战国末年，墨家处于鼎盛时期，基本疆域是华夏，完整疆域是墨家宇宙。</font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt"><span lang="en-US">abcdenm</span></font></font></p>
<p style="line-height: 200%; margin-bottom: 0cm"><font face="雅痞-簡"><font size="4" style="font-size: 14pt">战国九墨，齐楚燕韩赵魏秦吴越。</font></font></p>
